# Render Blueprint for Kitty (PRD §C4).
# Build phase: FREE plans (no card needed). The web app sleeps after 15 min idle (~1 min to wake),
# and the free database expires 30 days after creation (~7 Dec 2026).
# Phase 5 (before submitting): add a card in Render and upgrade in place to
#   web: starter   database: basic-256mb
# so the demo stays awake and the data survives judging (1–15 Dec). Usage is paid from Render credits.
databases:
  - name: kitty-db
    plan: free
    databaseName: kitty
    user: kitty

services:
  - type: web
    name: kitty-web
    runtime: node
    plan: free
    rootDir: web
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: kitty-db
          property: connectionString
      - key: PAYPAL_ENVIRONMENT
        value: SANDBOX
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: JOBS_KEY
        sync: false
      - key: DEV_CONSOLE_KEY
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
