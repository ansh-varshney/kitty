# Render Blueprint for Kitty (PRD §C4).
# Paid plans since 11 Nov 2026 (Phase 5), switched in place in the dashboard, paid from Render credits:
#   web: starter (now called 0.5c-512mb)   database: basic-256mb (now 0.1c-256mb)
# so the demo stays awake through judging (1-15 Dec) and the database doesn't expire. Render still accepts these
# plan names in Blueprints. After the winners are announced (~21 Dec): web back to free, delete the database.
databases:
  - name: kitty-db
    plan: basic-256mb
    databaseName: kitty
    user: kitty

services:
  - type: web
    name: kitty-web
    runtime: node
    plan: starter
    rootDir: web
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: kitty-db
          property: connectionString
      - key: PAYPAL_ENVIRONMENT
        value: SANDBOX
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: JOBS_KEY
        sync: false
      - key: DEV_CONSOLE_KEY
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
